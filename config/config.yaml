# =============================================================================
# udp_logger 配置文件
#   * YAML 只能用空格缩进，绝对不能用 Tab（这是最常见的报错原因）
#   * "键: 值" 的冒号后面必须有一个空格
#   * 字符串建议加引号，数字和 true/false 不要加引号
#   * 所有字段都有默认值；删掉某个字段不会导致程序起不来
#   * 改完本文件后重启程序即可生效（本期不支持热加载）
# =============================================================================

# ---------------------------- 网络 ----------------------------
network:
  # 监听地址。"0.0.0.0" = 监听本机所有网卡（推荐先用它确认能通）。
  # 只想监听某张网卡时改成该网卡的 IP，例如 "192.168.1.10"。
  bind_ip: "0.0.0.0"

  # 监听端口。请用 1024~65535；低于 1024 需要 root 权限。
  bind_port: 9000

  # 内核接收缓冲区（SO_RCVBUF）。调大能抵抗 MCU 突发流量，
  # 堆满之后内核才开始丢包。65536 通常够用，高速场景可到 262144。
  recv_buffer_bytes: 65536

  # recvfrom 超时（毫秒）。它决定了 Ctrl+C 后程序多久能退出。
  # 不建议小于 50，否则接收线程会频繁空转。
  recv_timeout_ms: 200

  # 仅当 MCU 用组播发送时才设为 true。
  join_multicast: false
  multicast_group: "239.0.0.1"

# ---------------------------- 队列 ----------------------------
queue:
  # 队列最大报文数。按"单包最大字节数 × 本值"估算内存占用。
  # 例：单包 1KB、capacity 4096 -> 约 4MB。
  capacity: 16

  # 队列满时的策略：
  #   drop_new = 丢弃新到的包（保证已入队的数据处理完整，推荐）
  #   drop_old = 丢弃最旧的包（保证总能看到最新数据）
  full_policy: "drop_new"

# ---------------------------- 解析与原始留档 ----------------------------
parser:
  # 是否把完整原始报文以 hex 写进独立文件。
  # 协议未定阶段强烈建议保持 true：解析逻辑将来一定会改，
  # 只有原始数据留档，现场采集的数据才能离线重新解析，不会白跑。
  raw_log_enabled: true

  # 原始报文文件路径（相对路径基于程序的工作目录）。
  raw_log_file: "logs/raw/udp_raw.log"

  # 日志里最多打印多少字节的 hex，避免大包把日志撑爆。
  max_payload_hex_bytes: 256

# ---------------------------- 日志 ----------------------------
log:
  # 写入日志文件的最低级别：INFO / WARNING / ERROR / FATAL
  # FATAL 会终止进程，不要拿来记"严重但不致命"的事。
  level: "INFO"

  # 是否同时输出到终端。注意这里用的是 alsologtostderr 语义：
  # 打开后终端和日志文件都会写，文件不会因此缺失（开发期建议 true）。
  also_log_to_stderr: true

  # 日志目录，不存在时程序会自动创建。
  dir: "logs"

  # 日志文件名前缀。最终文件形如：
  #   udp_logger.INFO.<主机名>.<用户名>.log.<日期>-<时间>.<pid>
  # 并生成软链接 udp_logger.INFO 指向最新文件，可直接 tail -f。
  file_prefix: "udp_logger"

  # 单个日志文件上限（MB）。超过后 glog 自动换新文件。
  # 控制器磁盘通常有限，建议 64~100。
  max_size_mb: 100

  # 保留的历史日志文件个数（每个级别分别计算）。
  # glog 自己只轮转不清理，程序启动时会按本值删除多余的历史文件。
  max_files: 100
